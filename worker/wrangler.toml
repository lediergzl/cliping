name = "ytdl-clipper-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
GITHUB_OWNER = "lediergzl"
GITHUB_REPO = "cliping"
GITHUB_WORKFLOW_FILE = "merge.yml"
GITHUB_REF = "main"

# Secrets (NO van aquí, se definen con `wrangler secret put <NOMBRE>`):
#   GITHUB_TOKEN  -> PAT con permisos Actions:write y Contents:read sobre el repo
#   CLIENT_TOKEN  -> cadena aleatoria propia, la misma que pones en el userscript
