<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YTDL Clipper — Editor</title>
<style>
:root{--bg:#08090c;--panel:#111318;--panel2:#171a20;--panel3:#1d2028;--line:#292e38;--line2:#353b47;--txt:#f5f7fb;--muted:#8f98a8;--accent:#7c5cff;--accent2:#9a82ff;--danger:#ef5b6b;--green:#35c98b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:13px/1.35 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{color:inherit;background:var(--panel3);border:1px solid var(--line2);border-radius:7px;padding:7px 11px;cursor:pointer;transition:.12s}button:hover{background:#262b35;border-color:#454c59}button:active{transform:translateY(1px)}button.primary{background:var(--accent);border-color:var(--accent);font-weight:700}.danger{color:#ff9aa6!important}
.app{height:100vh}
#app{height:100vh;display:grid;grid-template-rows:54px minmax(0,1fr) 300px}
header{display:flex;align-items:center;gap:12px;padding:0 14px;background:#0d0f13;border-bottom:1px solid var(--line);box-shadow:0 2px 12px #0008;z-index:30}
header b{font-size:15px;letter-spacing:.01em}header small{color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}
header nav{margin-left:auto;display:flex;gap:6px}header nav button{min-width:34px}

.left,#left,.right,#right{background:var(--panel);padding:13px;overflow:auto}.left,#left{border-right:1px solid var(--line)}.right,#right{border-left:1px solid var(--line)}
h4{font-size:10px;letter-spacing:.12em;color:#778092;margin:4px 0 10px;text-transform:uppercase}
.card{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px;margin-bottom:7px;cursor:pointer;transition:.12s}.card:hover{border-color:#444b59;background:#1b1e25}.card.sel{border-color:var(--accent);background:#252033;box-shadow:0 0 0 1px #7c5cff33}.card img{width:100%;height:64px;object-fit:cover;border-radius:6px;margin-bottom:6px}.card b,.card small,.card em{display:block}.card b{font-size:12px}.card small,.card em,p,.empty{color:var(--muted);font-size:10px;margin-top:4px}.card em{font-style:normal;font-size:9px;color:#a99ce0}
#center{min-width:0;display:flex;flex-direction:column;background:#090a0d;position:relative}
#stage{flex:1;min-height:0;margin:18px auto 12px;width:min(900px,92%);aspect-ratio:16/9;max-height:calc(100% - 78px);background:#020304;border:1px solid #252a33;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 16px 45px #0009}
#stage.aspect-916{aspect-ratio:9/16;width:min(430px,70%)}#stage.aspect-11{aspect-ratio:1/1;width:min(620px,75%)}#stage.aspect-169{aspect-ratio:16/9;width:min(900px,92%)}
#stage .composition{position:absolute;inset:0;overflow:hidden;background:#000}
#stage iframe.preview-media{position:absolute;left:50%;top:50%;width:100%;height:100%;transform-origin:center center;border:0}
#stage .overlay-title,#stage .overlay-watermark{position:absolute;z-index:5;pointer-events:none;text-shadow:0 2px 7px #000;font-weight:800}.overlay-title{left:50%;transform:translateX(-50%);font-size:clamp(18px,3vw,42px);max-width:90%;text-align:center}.overlay-watermark{right:3%;bottom:3%;font-size:clamp(12px,1.5vw,22px);opacity:.75}
#transport{height:52px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px;background:#0d0f13}#transport button:first-child{width:42px;height:34px;border-radius:17px;background:#eee;color:#111;border:0;font-weight:800}#clock{min-width:125px;text-align:center;color:#c0c7d3;font-variant-numeric:tabular-nums}
label{display:block;color:#929bab;font-size:11px;margin:11px 0 4px}input,select{width:100%;background:#0d1015;border:1px solid var(--line2);color:var(--txt);border-radius:6px;padding:7px;outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px #7c5cff22}.row{display:flex;gap:6px}.row>*{flex:1}.check{display:flex;align-items:center;gap:6px}.check input{width:auto}
#inspector>b{display:block;font-size:11px;letter-spacing:.1em;color:#c7bddf;padding-bottom:8px;border-bottom:1px solid var(--line)}#inspector .addrow{margin:0 0 10px}.addrow{display:flex;gap:6px}.addrow button{flex:1;font-size:10px}
#timeline{background:#101217;border-top:1px solid #303541;display:grid;grid-template-rows:38px 1fr;min-height:0;box-shadow:0 -8px 25px #0005}
.tlbar{display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--muted);border-bottom:1px solid var(--line)}.tlbar b{color:var(--txt);font-size:12px}.tlbar small{margin-left:auto;font-size:9px}.tlbar .tlctrl{display:flex;align-items:center;gap:5px}.tlbar input[type=range]{width:120px;padding:0}.tlbar button{padding:4px 7px;font-size:10px}.snap-on{color:#c4b5fd}
#scroll{position:relative;overflow:auto;padding:7px 12px 12px;background:#0e1014}
.ruler{height:22px;border-bottom:1px solid #2b3039;position:relative;min-width:800px}.ruler span{position:absolute;top:0;border-left:1px solid #343a45;height:22px;color:#697181;font-size:9px;padding-left:4px}
.lane{height:62px;min-width:800px;background:#0b0d11;border:1px solid #1e232c;border-radius:6px;margin-top:6px;position:relative}.lane.thin{height:43px}.lane label{position:absolute;left:7px;top:5px;margin:0;color:#5f6877;font-size:8px;z-index:2;font-weight:700;letter-spacing:.08em}
.lane>div{height:100%;display:flex;align-items:center}
.tlclip{height:46px;background:#29263c;border:1px solid #4d456c;border-radius:5px;padding:7px;cursor:grab;white-space:nowrap;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff05}.tlclip.sel{background:#40365d;border-color:#a78bfa;box-shadow:0 0 0 1px #a78bfa55}.tlclip:active{cursor:grabbing}
#head{position:absolute;top:29px;bottom:12px;width:2px;background:#ff4968;z-index:20;pointer-events:none;box-shadow:0 0 8px #ff496888}#head:before{content:"";position:absolute;top:-2px;left:-4px;width:10px;height:10px;border-radius:50%;background:#ff4968}
.tlitem{position:absolute;height:28px;top:8px;background:#26364b;border:1px solid #466584;border-radius:5px;padding:5px 8px;overflow:hidden;white-space:nowrap;cursor:pointer;font-size:10px;box-shadow:inset 0 0 0 1px #ffffff05}.tlitem.text{background:#392b4b;border-color:#76559b}.tlitem.audio{background:#244036;border-color:#4d8268}.tlitem.sel{outline:1px solid #c4b5fd;box-shadow:0 0 0 1px #c4b5fd inset}.tlitem.multi{box-shadow:0 0 0 1px #60a5fa inset}.tlitem .fade{position:absolute;top:0;bottom:0;width:18px;opacity:.35;pointer-events:none;background:linear-gradient(90deg,#fff0,#fff8)}.tlitem .fade.in{left:0}.tlitem .fade.out{right:0;transform:scaleX(-1)}.tlitem.audio .vol{position:absolute;left:8px;right:8px;bottom:3px;height:2px;background:#ffffff30;pointer-events:none}.tlitem.audio .vol i{display:block;height:100%;background:#9fe4bd;width:50%}.tlitem.audio .fadeCtl{position:absolute;top:1px;height:5px;width:22px;cursor:ew-resize;z-index:3}.tlitem.audio .fadeCtl.in{left:4px}.tlitem.audio .fadeCtl.out{right:4px}.tlitem .handle{position:absolute;top:0;width:6px;height:100%;cursor:ew-resize;background:#ffffff28}.tlitem .handle.l{left:0}.tlitem .handle.r{right:0}
#toast{position:fixed;right:18px;bottom:318px;background:#1d2129;border:1px solid #3a414e;padding:9px 13px;border-radius:7px;display:none;z-index:100;box-shadow:0 8px 25px #0008}#toast.show{display:block}
.empty{text-align:center;padding:25px}.empty a{color:#a78bfa}
@media(max-width:1000px){main{grid-template-columns:210px minmax(420px,1fr) 250px}#app{grid-template-rows:54px minmax(0,1fr) 270px}}
</style>
</head>
<body>
<div id="app"><header><b>YTDL Clipper</b><small>Editor</small><nav><button id="undo">↶</button><button id="redo">↷</button><button id="new">Nuevo</button><button id="save">Guardar</button><button class="primary" id="export">Exportar</button></nav></header>
<main><aside id="left"><h4>MEDIOS</h4><div id="media"></div><h4>CLIPS</h4><div id="clips"></div><p>Los clips pueden venir de vídeos distintos y conservarse juntos.</p></aside>
<section id="center"><div id="stage"><div class="empty">Selecciona un clip</div></div><div id="transport"><button id="play">▶</button><button id="back">−5s</button><span id="clock">0:00 / 0:00</span><button id="forward">+5s</button><button id="split">Cortar</button></div></section>
<aside id="right"><h4>INSPECTOR</h4><div id="inspector"></div></aside></main>
<section id="timeline"><div class="tlbar"><b>Timeline</b><span id="summary"></span><div class="tlctrl"><button id="snap" title="Ajustar al grid y bordes">Snap: ON</button><button id="tlminus">−</button><input id="tlzoom" type="range" min="8" max="60" value="18"><button id="tlplus">+</button></div><small>Ctrl/Cmd: selección múltiple · Arrastra el cabezal</small></div><div id="scroll"><div id="ruler"></div><div class="lane"><label>VIDEO</label><div id="tlclips"></div></div><div class="lane thin"><label>TEXTO</label><div id="tltext"></div></div><div class="lane thin"><label>AUDIO</label><div id="tlaudio"></div></div><i id="head"></i></div></section><div id="toast"></div>
<script>
(function(){
'use strict';
var KEY='ytdl-clipper-editor-project:v2',PX=18,project,selectedId=null,selectedIds=[],history=[],future=[],playTime=0,timer=null,playing=false,snapEnabled=true,draggingHead=false,audioSignature='';

function enc(v){var a=new TextEncoder().encode(JSON.stringify(v)),s='';for(var i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

function commit(){history.push(clone(project));if(history.length>50)history.shift();future=[];save();render()}
function current(){return project.clips.find(function(c){return c.id===selectedId})||null}function currentLayer(){var all=(project.tracks.text||[]).concat(project.tracks.audio||[]);return all.find(function(x){return x.id===selectedId})||null}function projectTrackEnd(){return Math.max(total(),(project.tracks.text||[]).reduce(function(a,x){return Math.max(a,+x.end||0)},0),(project.tracks.audio||[]).reduce(function(a,x){return Math.max(a,+x.end||0)},0))}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},1800)}
function render(){
renderMedia();renderClips();renderTimeline();renderInspector();renderPreview();clock();document.getElementById('summary').textContent=project.clips.length+' clips · '+fmt(total());
}
function renderMedia(){var e=document.getElementById('media');e.innerHTML='';project.media.forEach(function(m){var d=document.createElement('div');d.className='card';var id=ytId(m.url);d.innerHTML=(id?'<img src="https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg">':'')+'<b>'+esc(m.title||source(m.url))+'</b><small>'+source(m.url)+' · '+project.clips.filter(function(c){return c.mediaId===m.id}).length+' clips</small>';d.onclick=function(){var c=project.clips.find(function(x){return x.mediaId===m.id});if(c){selectedId=c.id;render()}};e.appendChild(d)})}
function renderClips(){var e=document.getElementById('clips');e.innerHTML='';project.clips.forEach(function(c,i){var d=document.createElement('div');d.className='card '+(c.id===selectedId?'sel':'');d.draggable=true;d.innerHTML='<b>Clip '+(i+1)+'</b><small>'+fmt(c.start)+' → '+fmt(c.end)+' · '+fmt(dur(c))+'</small><em>'+source(media(c).url)+'</em>';d.onclick=function(){selectedId=c.id;playTime=0;render()};d.ondragstart=function(x){x.dataTransfer.setData('clip',c.id)};e.appendChild(d)})}

function allLayers(){return (project.tracks.text||[]).concat(project.tracks.audio||[])}
function isSelected(id){return id===selectedId||selectedIds.indexOf(id)>=0}
function setSelected(id,multi){if(multi){var i=selectedIds.indexOf(id);if(i>=0)selectedIds.splice(i,1);else selectedIds.push(id);selectedId=id}else{selectedIds=[id];selectedId=id}}
function snapTime(v,ignoreId){if(!snapEnabled)return Math.max(0,v);var step=0.25,best=Math.round(v/step)*step,dist=Math.abs(v-best);project.clips.forEach(function(c){var p=0;for(var i=0;i<project.clips.length;i++){if(project.clips[i].id===c.id)break;p+=dur(project.clips[i])} [p,p+dur(c)].forEach(function(q){var d=Math.abs(v-q);if(d<dist){dist=d;best=q}})});allLayers().forEach(function(x){if(x.id!==ignoreId)[+x.start,+x.end].forEach(function(q){var d=Math.abs(v-q);if(d<dist){dist=d;best=q}})});return Math.max(0,best)}
function refreshTimelineScale(){document.querySelectorAll('#ruler,#tlclips,#tltext,#tlaudio,.lane').forEach(function(e){if(e.classList.contains('lane'))e.style.minWidth=Math.max(800,(projectTrackEnd()+5)*PX)+'px'});renderTimeline();clock()}
function audioKey(){return allLayers().filter(function(x){return x.type==='audio'&&x.sourceUrl&&playTime>=x.start&&playTime<x.end}).map(function(x){return x.id+':'+x.sourceUrl}).join('|')}
function syncAudioLayers(){var wrap=document.querySelector('#stage .composition');if(!wrap)return;var key=audioKey();if(key!==audioSignature){wrap.querySelectorAll('audio').forEach(function(a){a.pause();a.remove()});allLayers().filter(function(x){return x.type==='audio'&&x.sourceUrl&&playTime>=x.start&&playTime<x.end}).forEach(function(l){var a=document.createElement('audio');a.src=l.sourceUrl;a.preload='auto';a.dataset.id=l.id;a.style.display='none';wrap.appendChild(a)});audioSignature=key}wrap.querySelectorAll('audio').forEach(function(a){var l=project.tracks.audio.find(function(x){return x.id===a.dataset.id});if(!l)return;try{a.currentTime=Math.max(0,playTime-l.start+(+l.sourceStart||0));a.volume=Math.max(0,Math.min(1,l.volume==null?1:+l.volume));if(playing){var p=a.play();if(p&&p.catch)p.catch(function(){})}else a.pause()}catch(e){}})}
