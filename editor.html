<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YTDL Clipper — Editor</title>
<style>
:root{--bg:#0b0b0e;--p:#151519;--p2:#1d1d23;--line:#34343e;--txt:#f4f4f5;--muted:#a1a1aa;--accent:#8b5cf6;--danger:#ef4444}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:13px/1.35 Inter,system-ui,sans-serif}button,input,select{font:inherit}button{color:inherit;background:var(--p2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}button.primary{background:#7c3aed;border-color:#7c3aed}.danger{color:#fca5a5}.app{height:100vh}
#app{height:100vh;display:grid;grid-template-rows:50px 1fr 245px}header{display:flex;align-items:center;gap:8px;padding:0 12px;background:#111116;border-bottom:1px solid var(--line)}header small{color:var(--muted)}header nav{margin-left:auto;display:flex;gap:6px}
main{min-height:0;display:grid;grid-template-columns:235px minmax(420px,1fr) 265px}.left,#left,.right,#right{background:var(--p);padding:11px;overflow:auto}.left,#left{border-right:1px solid var(--line)}.right,#right{border-left:1px solid var(--line)}h4{font-size:10px;letter-spacing:.09em;color:var(--muted);margin:4px 0 8px}.card{border:1px solid var(--line);background:var(--p2);border-radius:7px;padding:8px;margin-bottom:6px;cursor:pointer}.card.sel{border-color:var(--accent);background:#302544}.card img{width:100%;height:55px;object-fit:cover;border-radius:5px;margin-bottom:5px}.card b,.card small,.card em{display:block}.card small,.card em,p,.empty{color:var(--muted);font-size:10px;margin-top:4px}.card em{font-style:normal;font-size:9px;color:#b9a8df}
#center{min-width:0;display:flex;flex-direction:column;background:#09090c}
#stage.aspect-916{aspect-ratio:9/16;width:min(430px,92%)}#stage.aspect-11{aspect-ratio:1/1;width:min(620px,92%)}#stage.aspect-169{aspect-ratio:16/9}#stage .composition{position:absolute;inset:0;overflow:hidden;background:#000}#stage iframe.preview-media{position:absolute;left:50%;top:50%;width:100%;height:100%;transform-origin:center center;transition:transform .15s linear}#stage .overlay-title,#stage .overlay-watermark{position:absolute;z-index:5;pointer-events:none;text-shadow:0 2px 5px #000;font-weight:800}.overlay-title{left:50%;transform:translateX(-50%);font-size:clamp(18px,3vw,42px);max-width:90%;text-align:center}.overlay-watermark{right:3%;bottom:3%;font-size:clamp(12px,1.5vw,22px);opacity:.75}#stage{flex:1;min-height:0;margin:auto;width:min(850px,94%);aspect-ratio:16/9;background:#000;border:1px solid #292930;border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}.stage iframe,#stage iframe{width:100%;height:100%;border:0}.empty{text-align:center;padding:25px}#transport{height:48px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px}#clock{min-width:110px;text-align:center;color:var(--muted)}
label{display:block;color:var(--muted);font-size:11px;margin:10px 0 4px}input,select{width:100%;background:#101014;border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:7px}.row{display:flex;gap:5px}.row>*{flex:1}.check{display:flex;align-items:center;gap:6px}.check input{width:auto}
#timeline{background:#151519;border-top:1px solid var(--line);display:grid;grid-template-rows:34px 1fr;min-height:0}.tlbar{display:flex;align-items:center;gap:9px;padding:0 11px;color:var(--muted)}.tlbar small{margin-left:auto}.tlbar b{color:var(--txt)}#scroll{position:relative;overflow:auto;padding:8px 12px}.ruler{height:22px;border-bottom:1px solid var(--line);position:relative;min-width:800px}.ruler span{position:absolute;top:0;border-left:1px solid #3b3b44;height:22px;color:#777;font-size:9px;padding-left:3px}.lane{height:58px;min-width:800px;background:#101014;border-radius:5px;margin-top:7px;position:relative}.lane.thin{height:34px}.lane label{position:absolute;left:5px;top:4px;margin:0;color:#666;font-size:9px;z-index:2}.lane>div{height:100%;display:flex;align-items:center}.tlclip{height:42px;background:#302943;border:1px solid #5d4b78;border-radius:5px;padding:6px;cursor:grab;white-space:nowrap;overflow:hidden}.tlclip.sel{background:#443258;border-color:#c4b5fd}#head{position:absolute;top:30px;bottom:7px;width:2px;background:#f43f5e;z-index:20;pointer-events:none}#toast{position:fixed;right:15px;bottom:260px;background:#24242b;border:1px solid var(--line);padding:9px 12px;border-radius:7px;display:none}#toast.show{display:block}
@media(max-width:900px){main{grid-template-columns:190px minmax(360px,1fr) 220px}}
</style>
</head>
<body>
<div id="app"><header><b>YTDL Clipper</b><small>Editor</small><nav><button id="undo">↶</button><button id="redo">↷</button><button id="new">Nuevo</button><button id="save">Guardar</button><button class="primary" id="export">Exportar</button></nav></header>
<main><aside id="left"><h4>MEDIOS</h4><div id="media"></div><h4>CLIPS</h4><div id="clips"></div><p>Los clips pueden venir de vídeos distintos y conservarse juntos.</p></aside>
<section id="center"><div id="stage"><div class="empty">Selecciona un clip</div></div><div id="transport"><button id="play">▶</button><button id="back">−5s</button><span id="clock">0:00 / 0:00</span><button id="forward">+5s</button><button id="split">Cortar</button></div></section>
<aside id="right"><h4>INSPECTOR</h4><div id="inspector"></div></aside></main>
<section id="timeline"><div class="tlbar"><b>Timeline</b><span id="summary"></span><small>Arrastra para reordenar</small></div><div id="scroll"><div id="ruler"></div><div class="lane"><label>VIDEO</label><div id="tlclips"></div></div><div class="lane thin"><label>TEXTO</label></div><div class="lane thin"><label>AUDIO</label></div><i id="head"></i></div></section><div id="toast"></div>
<script>
(function(){
'use strict';
var KEY='ytdl-clipper-editor-project:v2',PX=18,project,selectedId=null,history=[],future=[],playTime=0,timer=null,playing=false;
function uid(p){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function fmt(n){n=Math.max(0,Math.floor(+n||0));var m=Math.floor(n/60),s=n%60;return m+':'+String(s).padStart(2,'0')}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function source(u){try{var h=new URL(u).hostname;if(h.indexOf('youtube')>=0)return'YouTube';if(h.indexOf('twitch')>=0)return'Twitch';return h}catch(e){return'origen'}}
function ytId(u){try{var x=new URL(u);if(x.hostname.indexOf('youtu.be')>=0)return x.pathname.slice(1);if(x.searchParams.get('v'))return x.searchParams.get('v');var m=x.pathname.match(/\/(?:shorts|embed)\/([^/]+)/);return m?m[1]:null}catch(e){return null}}
function dur(c){return Math.max(.1,(+c.end||0)-(+c.start||0))}
function total(){return project.clips.reduce(function(a,c){return a+dur(c)},0)}
function media(c){return project.media.find(function(m){return m.id===c.mediaId})||{url:c.sourceUrl,title:source(c.sourceUrl)}}
function normalize(p){p=p||{};var old=Array.isArray(p.segments)?p.segments:[],clips=Array.isArray(p.clips)?p.clips.map(function(c){return Object.assign({transform:{x:0,y:0,scale:1,rotation:0,fit:'cover'}},c,{id:c.id||uid('clip')})}):old.map(function(s){return{id:uid('clip'),sourceUrl:s.sourceUrl||s.source_url||'',start:+s.start||0,end:+s.end||.1,zoom:s.zoom||null,transition:s.transition||null,transform:s.transform||{x:0,y:0,scale:1,rotation:0,fit:'cover'}}});
var mediaList=Array.isArray(p.media)?p.media.slice():[],ids={};clips.forEach(function(c){var u=c.sourceUrl||'';ids[u]=ids[u]||uid('media');c.mediaId=c.mediaId||ids[u];if(!mediaList.some(function(m){return m.id===c.mediaId}))mediaList.push({id:c.mediaId,url:u,title:source(u)})});
return{id:p.id||uid('project'),name:p.name||'Proyecto YTDL Clipper',media:mediaList,clips:clips,output:p.output||{aspect_ratio:'9:16'},tracks:p.tracks||{video:['main'],text:[],audio:[]}}}
function enc(v){var a=new TextEncoder().encode(JSON.stringify(v)),s='';for(var i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(){try{var s=location.hash.slice(1);if(!s)return null;s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),a=Uint8Array.from(b,function(c){return c.charCodeAt(0)});return JSON.parse(new TextDecoder().decode(a))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(project));location.hash=enc(project)}catch(e){}}
function commit(){history.push(clone(project));if(history.length>50)history.shift();future=[];save();render()}
function current(){return project.clips.find(function(c){return c.id===selectedId})||null}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},1800)}
function render(){
renderMedia();renderClips();renderTimeline();renderInspector();renderPreview();clock();document.getElementById('summary').textContent=project.clips.length+' clips · '+fmt(total());
}
function renderMedia(){var e=document.getElementById('media');e.innerHTML='';project.media.forEach(function(m){var d=document.createElement('div');d.className='card';var id=ytId(m.url);d.innerHTML=(id?'<img src="https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg">':'')+'<b>'+esc(m.title||source(m.url))+'</b><small>'+source(m.url)+' · '+project.clips.filter(function(c){return c.mediaId===m.id}).length+' clips</small>';d.onclick=function(){var c=project.clips.find(function(x){return x.mediaId===m.id});if(c){selectedId=c.id;render()}};e.appendChild(d)})}
function renderClips(){var e=document.getElementById('clips');e.innerHTML='';project.clips.forEach(function(c,i){var d=document.createElement('div');d.className='card '+(c.id===selectedId?'sel':'');d.draggable=true;d.innerHTML='<b>Clip '+(i+1)+'</b><small>'+fmt(c.start)+' → '+fmt(c.end)+' · '+fmt(dur(c))+'</small><em>'+source(media(c).url)+'</em>';d.onclick=function(){selectedId=c.id;playTime=0;render()};d.ondragstart=function(x){x.dataTransfer.setData('clip',c.id)};e.appendChild(d)})}
function clipAtTime(t){var p=0;for(var i=0;i<project.clips.length;i++){var c=project.clips[i],d=dur(c);if(t>=p&&t<p+d)return{i:i,c:c,local:t-p,start:p,end:p+d};p+=d}return project.clips.length?{i:project.clips.length-1,c:project.clips[project.clips.length-1],local:dur(project.clips[project.clips.length-1]),start:Math.max(0,p-dur(project.clips[project.clips.length-1])),end:p}:null}
function renderTimeline(){var e=document.getElementById('tlclips');e.innerHTML='';var p=0;project.clips.forEach(function(c,i){var d=document.createElement('div');d.className='tlclip '+(c.id===selectedId?'sel':'');d.style.width=Math.max(36,dur(c)*PX)+'px';d.dataset.start=p;d.title=fmt(p)+' → '+fmt(p+dur(c));d.textContent=(i+1)+' · '+fmt(dur(c));d.draggable=true;d.onclick=function(){selectedId=c.id;playTime=p;render()};d.ondragstart=function(x){x.dataTransfer.setData('clip',c.id)};d.ondragover=function(x){x.preventDefault()};d.ondrop=function(x){x.preventDefault();var id=x.dataTransfer.getData('clip'),from=project.clips.findIndex(function(q){return q.id===id});if(from<0||from===i)return;var c2=project.clips.splice(from,1)[0];project.clips.splice(i,0,c2);selectedId=c2.id;commit()};e.appendChild(d);p+=dur(c)});var r=document.getElementById('ruler');r.style.width=Math.max(800,(total()+10)*PX)+'px';r.innerHTML='';for(var s=0;s<=total()+10;s+=5){var t=document.createElement('span');t.style.left=s*PX+'px';t.textContent=fmt(s);r.appendChild(t)}}

function renderInspector(){var e=document.getElementById('inspector'),c=current();if(!c){e.innerHTML='<p>Selecciona un clip.</p>';return}var m=media(c),t=c.transform||{x:0,y:0,scale:1,rotation:0,fit:'cover'};e.innerHTML='<small>'+esc(m.title||source(m.url))+'</small><label>Inicio<input id="st" type="number" step=".1" value="'+c.start+'"></label><label>Fin<input id="en" type="number" step=".1" value="'+c.end+'"></label><hr><b>TRANSFORMAR CLIP</b><label>Escala<input id="scale" type="number" min=".25" max="4" step=".05" value="'+t.scale+'"></label><label>Posición X<input id="posx" type="number" min="-100" max="100" step="1" value="'+t.x+'"></label><label>Posición Y<input id="posy" type="number" min="-100" max="100" step="1" value="'+t.y+'"></label><label>Rotación<input id="rot" type="number" min="-180" max="180" step="1" value="'+t.rotation+'"></label><label>Ajuste<select id="fit"><option value="cover">Rellenar</option><option value="contain">Encajar</option></select></label><label>Zoom<select id="zoom"><option value="0">Sin zoom</option><option value="1.15">1.15×</option><option value="1.3">1.30×</option><option value="1.5">1.50×</option><option value="2">2×</option></select></label><label class="check"><input id="kb" type="checkbox"> Ken Burns</label><label>Transición<select id="tr"><option value="none">Ninguna</option><option value="fade">Fade</option><option value="dissolve">Dissolve</option><option value="wipe">Wipe</option></select></label><label>Duración<input id="td" type="number" min=".2" max="3" step=".1" value="'+(c.transition&&c.transition.duration||.5)+'"></label><hr><b>PROYECTO</b><label>Formato<select id="aspect"><option>9:16</option><option>16:9</option><option>1:1</option><option>original</option></select></label><label>Título<input id="title" value="'+esc(project.output.title&&project.output.title.text||'')+'"></label><label>Posición<select id="titlepos"><option value="top">Arriba</option><option value="center">Centro</option><option value="bottom">Abajo</option></select></label><label>Marca de agua<input id="wm" value="'+esc(project.output.watermark&&project.output.watermark.text||'')+'"></label><label class="check"><input id="norm" type="checkbox"> Normalizar audio</label><button id="delete" class="danger wide">Eliminar clip</button>';
document.getElementById('zoom').value=c.zoom&&c.zoom.factor?String(c.zoom.factor):'0';document.getElementById('kb').checked=!!(c.zoom&&c.zoom.kenburns);document.getElementById('tr').value=c.transition&&c.transition.type||'none';document.getElementById('fit').value=t.fit||'cover';document.getElementById('aspect').value=project.output.aspect_ratio||'9:16';document.getElementById('titlepos').value=project.output.title&&project.output.title.position||'bottom';document.getElementById('norm').checked=!!project.output.normalize_audio;
function apply(){c.start=Math.max(0,+document.getElementById('st').value||0);c.end=Math.max(c.start+.1,+document.getElementById('en').value||c.start+.1);var z=+document.getElementById('zoom').value;c.zoom=z?{factor:z,kenburns:document.getElementById('kb').checked}:null;c.transform={x:Math.max(-100,Math.min(100,+document.getElementById('posx').value||0)),y:Math.max(-100,Math.min(100,+document.getElementById('posy').value||0)),scale:Math.max(.25,Math.min(4,+document.getElementById('scale').value||1)),rotation:Math.max(-180,Math.min(180,+document.getElementById('rot').value||0)),fit:document.getElementById('fit').value};var tr=document.getElementById('tr').value;c.transition=tr==='none'?null:{type:tr,duration:+document.getElementById('td').value||.5};project.output.aspect_ratio=document.getElementById('aspect').value;var title=document.getElementById('title').value.trim();project.output.title=title?{text:title,position:document.getElementById('titlepos').value,duration:'start'}:null;var wm=document.getElementById('wm').value.trim();project.output.watermark=wm?{text:wm,position:'bottom'}:null;project.output.normalize_audio=document.getElementById('norm').checked;commit()}
['st','en','scale','posx','posy','rot','fit','zoom','kb','tr','td','aspect','title','titlepos','wm','norm'].forEach(function(id){document.getElementById(id).addEventListener('change',apply)});
document.getElementById('delete').onclick=function(){var i=project.clips.findIndex(function(x){return x.id===c.id});project.clips.splice(i,1);selectedId=project.clips[Math.max(0,i-1)]?.id||null;commit()}
}
function embed(u,start){var n=source(u);if(n==='YouTube'){var id=ytId(u);return id?'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?controls=1&playsinline=1&rel=0&enablejsapi=1&start='+Math.floor(start):null}if(n==='Twitch'){try{var x=new URL(u),v=x.pathname.match(/\/videos\/(\d+)/);if(v)return'https://player.twitch.tv/?video='+v[1]+'&parent='+location.hostname;var ch=x.pathname.split('/').filter(Boolean)[0];if(ch)return'https://player.twitch.tv/?channel='+encodeURIComponent(ch)+'&parent='+location.hostname}catch(e){}}return null}
function renderPreview(){var e=document.getElementById('stage'),c=current();if(!c){e.className='';e.innerHTML='<div class="empty">Selecciona un clip</div>';return}var ar=project.output.aspect_ratio||'9:16';e.className=ar==='9:16'?'aspect-916':ar==='1:1'?'aspect-11':'aspect-169';var u=embed(media(c).url,c.start);e.innerHTML='';var wrap=document.createElement('div');wrap.className='composition';if(u){var f=document.createElement('iframe');f.className='preview-media';f.src=u;f.allow='autoplay;fullscreen;picture-in-picture';f.allowFullscreen=true;var t=c.transform||{x:0,y:0,scale:1,rotation:0,fit:'cover'},z=c.zoom&&c.zoom.factor?c.zoom.factor:1;f.style.objectFit=t.fit||'cover';f.style.transform='translate(calc(-50% + '+t.x+'%), calc(-50% + '+t.y+'%)) scale('+(t.scale*z)+') rotate('+t.rotation+'deg)';wrap.appendChild(f)}else wrap.innerHTML='<div class="empty">Este origen no admite preview incrustado.<br><a target="_blank" rel="noopener" href="'+esc(media(c).url)+'">Abrir fuente</a><p>El render definitivo usa yt-dlp.</p></div>';var title=project.output.title&&project.output.title.text;if(title){var te=document.createElement('div');te.className='overlay-title';te.textContent=title;te.style.top=project.output.title.position==='top'?'5%':project.output.title.position==='center'?'45%':'82%';wrap.appendChild(te)}var wm=project.output.watermark&&project.output.watermark.text;if(wm){var we=document.createElement('div');we.className='overlay-watermark';we.textContent=wm;wrap.appendChild(we)}e.appendChild(wrap)}
function clock(){var at=clipAtTime(playTime);if(at&&at.c.id!==selectedId){selectedId=at.c.id;renderPreview()}document.getElementById('clock').textContent=fmt(playTime)+' / '+fmt(total());document.getElementById('head').style.left=(12+playTime*PX)+'px'}
function exportProject(){if(!project.clips.length){toast('No hay clips');return}var payload={url:project.clips[0].sourceUrl||media(project.clips[0]).url,segments:project.clips.map(function(c){return{source_url:c.sourceUrl||media(c).url,start:+c.start,end:+c.end,zoom:c.zoom||null,transition:c.transition||null}}),output:project.output||{}};if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'ytdl-editor-export',payload:payload},'*');toast('Proyecto enviado al capturador')}else{try{navigator.clipboard.writeText(JSON.stringify(payload));toast('Payload copiado')}catch(e){alert('Abre el editor desde el capturador')}}}
function playClipAt(index){if(index<0||index>=project.clips.length){playing=false;clearInterval(timer);return}selectedId=project.clips[index].id;playTime=project.clips.slice(0,index).reduce(function(a,c){return a+dur(c)},0);renderPreview();clock();var f=document.querySelector('#stage iframe');if(f)setTimeout(function(){try{f.contentWindow.postMessage(JSON.stringify({event:'command',func:'playVideo',args:[]}), '*')}catch(e){}} ,500)}
document.getElementById('play').onclick=function(){playing=!playing;this.textContent=playing?'❚❚':'▶';if(playing){clearInterval(timer);timer=setInterval(function(){playTime=Math.min(total(),playTime+.1);clock();if(playTime>=total()){playing=false;clearInterval(timer);document.getElementById('play').textContent='▶'}},100)}else clearInterval(timer)};
document.getElementById('back').onclick=function(){playTime=Math.max(0,playTime-5);var a=clipAtTime(playTime);if(a)selectedId=a.c.id;renderPreview();clock()};document.getElementById('forward').onclick=function(){playTime=Math.min(total(),playTime+5);var a=clipAtTime(playTime);if(a)selectedId=a.c.id;renderPreview();clock()};
document.getElementById('split').onclick=function(){var c=current();if(!c)return;var a=clipAtTime(playTime);if(!a||a.c.id!==c.id){toast('El cursor debe estar dentro del clip seleccionado');return}var abs=c.start+a.local;if(abs<=c.start+.1||abs>=c.end-.1){toast('El cursor debe estar dentro del clip');return}var b=clone(c);b.id=uid('clip');b.start=abs;c.end=abs;var i=project.clips.findIndex(function(x){return x.id===c.id});project.clips.splice(i+1,0,b);selectedId=b.id;commit()};
document.getElementById('undo').onclick=function(){if(!history.length)return;future.push(clone(project));project=history.pop();selectedId=project.clips[0]?.id||null;save();render()};document.getElementById('redo').onclick=function(){if(!future.length)return;history.push(clone(project));project=future.pop();selectedId=project.clips[0]?.id||null;save();render()};document.getElementById('new').onclick=function(){if(confirm('¿Crear un proyecto vacío?')){history.push(clone(project));project=normalize({});selectedId=null;save();render()}};document.getElementById('save').onclick=function(){save();toast('Proyecto guardado')};document.getElementById('export').onclick=exportProject;
window.addEventListener('beforeunload',function(){clearInterval(timer);save()});project=normalize(dec()||JSON.parse(localStorage.getItem(KEY)||'null')||{});project.clips.forEach(function(c){c.transform=c.transform||{x:0,y:0,scale:1,rotation:0,fit:'cover'}});selectedId=project.clips[0]?.id||null;render();
})();
</script>
</body></html>
