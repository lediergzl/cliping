<style>

*{box-sizing:border-box}

#app{height:100vh;display:grid;grid-template-rows:48px minmax(0,1fr) 318px}

#center{min-width:0;display:flex;flex-direction:column;background:#0b0d10;position:relative}

#stage.aspect-916{aspect-ratio:9/16;width:min(390px,58%)}#stage.aspect-11{aspect-ratio:1/1;width:min(580px,68%)}#stage.aspect-169{aspect-ratio:16/9;width:min(880px,94%)}

#stage .overlay-title,#stage .overlay-watermark{position:absolute;z-index:5;pointer-events:none;text-shadow:0 2px 6px #000;font-weight:700}.overlay-title{left:50%;transform:translateX(-50%);font-size:clamp(18px,3vw,42px);max-width:90%;text-align:center}.overlay-watermark{right:3%;bottom:3%;font-size:clamp(12px,1.5vw,22px);opacity:.7}
#transport{height:44px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:3px;background:#101216}#transport button{min-width:34px;height:28px;padding:3px 8px;border-color:transparent;background:transparent}#transport button:hover{background:#24282e}#transport button:first-child{width:34px;border:1px solid #4a4f58;background:#1f2329;border-radius:50%;font-size:11px}#clock{min-width:118px;text-align:center;color:#aeb4bd;font-variant-numeric:tabular-nums;font-size:11px}
#inspector{padding:11px 12px}.addrow{display:flex;gap:4px}.addrow button{flex:1;font-size:10px}.rightlabel,label{display:block;color:#777f8a;font-size:10px;margin:10px 0 4px}input,select{width:100%;background:#0f1115;border:1px solid #30353d;color:#dfe2e7;border-radius:2px;padding:6px;outline:none}input:focus,select:focus{border-color:#6e5ab1}.row{display:flex;gap:6px}.row>*{flex:1}#inspector>b{display:block;font-size:10px;letter-spacing:.12em;color:#b2a5d7;border-bottom:1px solid var(--line);padding-bottom:9px}
#timeline{background:#111318;border-top:1px solid #30343b;display:grid;grid-template-rows:36px 1fr;min-height:0}
.tlbar{display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);color:#777f8b}.tlbar b{font-size:11px;color:#d8dbe0;font-weight:600}.tlbar small{margin-left:auto;font-size:9px;color:#646b76}.tlbar .tlctrl{display:flex;align-items:center;gap:3px}.tlbar input[type=range]{width:105px;padding:0}.tlbar button{padding:3px 6px;font-size:9px}.snap-on{color:#b8a4ee}
#scroll{position:relative;overflow:auto;padding:6px 10px 10px;background:#0d0f13}.ruler{height:23px;border-bottom:1px solid #2c3037;position:relative;min-width:800px}.ruler span{position:absolute;top:0;border-left:1px solid #383d45;height:23px;color:#666d78;font-size:8px;padding-left:4px}
.lane{height:66px;min-width:800px;background:#0b0d10;border-bottom:1px solid #252930;position:relative;margin:0}.lane.thin{height:42px}.lane label{position:absolute;left:7px;top:5px;margin:0;color:#626a75;font-size:8px;z-index:2;font-weight:600;letter-spacing:.1em}.lane>div{height:100%;display:flex;align-items:center}
.tlclip{height:48px;background:#272b32;border:1px solid #454b55;border-radius:2px;padding:6px;cursor:grab;white-space:nowrap;overflow:hidden;color:#c7ccd4}.tlclip:hover{background:#30353d}.tlclip.sel{background:#3a3152;border-color:#9276e5;box-shadow:inset 0 0 0 1px #9276e566}.tlclip:active{cursor:grabbing}
#head{position:absolute;top:28px;bottom:10px;width:1px;background:#f14f64;z-index:20;pointer-events:none;box-shadow:0 0 5px #f14f6466}#head:before{content:"";position:absolute;top:-1px;left:-4px;width:9px;height:9px;background:#f14f64;clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}

#toast{position:fixed;right:14px;bottom:330px;background:#1c2026;border:1px solid #414750;padding:8px 11px;border-radius:3px;display:none;z-index:100;box-shadow:0 6px 18px #0008}.toast.show{display:block}.empty{text-align:center;padding:25px;color:#717984;font-size:11px}.empty a{color:#aa95ee}
@media(max-width:1000px){main{grid-template-columns:220px minmax(420px,1fr) 245px}#app{grid-template-rows:48px minmax(0,1fr) 285px}}
</style>

<body>
<div id="app"><header><b>YTDL Clipper</b><small>EDITOR / PROYECTO</small><nav><button id="undo" title="Deshacer">↶</button><button id="redo" title="Rehacer">↷</button><button id="new">Nuevo proyecto</button><button id="save">Guardar</button><button class="primary" id="export">Exportar</button></nav></header>
<main><aside id="left"><h4>PROYECTO · MEDIOS</h4><div id="media"></div><h4>CLIPS · SECUENCIA</h4><div id="clips"></div><p>Los clips pueden venir de vídeos distintos y conservarse juntos.</p></aside>
<section id="center"><div id="stage"><div class="empty">Selecciona un clip</div></div><div id="transport"><button id="play">▶</button><button id="back">−5s</button><span id="clock">0:00 / 0:00</span><button id="forward">+5s</button><button id="split">Cortar</button></div></section>
<aside id="right"><h4>PROPIEDADES</h4><div id="inspector"></div></aside></main>
<section id="timeline"><div class="tlbar"><b>LÍNEA DE TIEMPO</b><span id="summary"></span><div class="tlctrl"><button id="snap" title="Ajustar al grid y bordes">Snap: ON</button><button id="tlminus">−</button><input id="tlzoom" type="range" min="8" max="60" value="18"><button id="tlplus">+</button></div><small>Ctrl/Cmd: selección múltiple · Arrastra el cabezal</small></div><div id="scroll"><div id="ruler"></div><div class="lane"><label>VIDEO</label><div id="tlclips"></div></div><div class="lane thin"><label>TEXTO</label><div id="tltext"></div></div><div class="lane thin"><label>AUDIO</label><div id="tlaudio"></div></div><i id="head"></i></div></section><div id="toast"></div>
<script>
(function(){
'use strict';
var KEY='ytdl-clipper-editor-project:v2',PX=18,project,selectedId=null,selectedIds=[],history=[],future=[],playTime=0,timer=null,playing=false,snapEnabled=true,draggingHead=false,audioSignature='',bridgeWindow=null,bridgeOrigin='',bridgeId='';
function uid(p){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function fmt(n){n=Math.max(0,Math.floor(+n||0));var m=Math.floor(n/60),s=n%60;return m+':'+String(s).padStart(2,'0')}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function source(u){try{var h=new URL(u).hostname;if(h.indexOf('youtube')>=0)return'YouTube';if(h.indexOf('twitch')>=0)return'Twitch';return h}catch(e){return'origen'}}
function ytId(u){try{var x=new URL(u);if(x.hostname.indexOf('youtu.be')>=0)return x.pathname.slice(1);if(x.searchParams.get('v'))return x.searchParams.get('v');var m=x.pathname.match(/\/(?:shorts|embed)\/([^/]+)/);return m?m[1]:null}catch(e){return null}}
function dur(c){return Math.max(.1,(+c.end||0)-(+c.start||0))}
function total(){return project.clips.reduce(function(a,c){return a+dur(c)},0)}
function media(c){return project.media.find(function(m){return m.id===c.mediaId})||{url:c.sourceUrl,title:source(c.sourceUrl)}}
function normalize(p){p=p||{};var old=Array.isArray(p.segments)?p.segments:[],rawClips=Array.isArray(p.clips)?p.clips.map(function(c){return Object.assign({transform:{x:0,y:0,scale:1,rotation:0,fit:'cover'}},c,{id:c.id||uid('clip')})}):old.map(function(s){return{id:uid('clip'),sourceUrl:s.sourceUrl||s.source_url||'',start:+s.start||0,end:+s.end||.1,zoom:s.zoom||null,transition:s.transition||null,transform:s.transform||{x:0,y:0,scale:1,rotation:0,fit:'cover'}}});
var seen={};var clips=rawClips.filter(function(c){var u=String(c.sourceUrl||c.source_url||'').trim().replace(/#.*$/,'');var a=Number(c.start),b=Number(c.end);var sig=u+'|'+(Number.isFinite(a)?a.toFixed(3):'NaN')+'|'+(Number.isFinite(b)?b.toFixed(3):'NaN');if(seen[sig])return false;seen[sig]=true;return true});
var mediaList=Array.isArray(p.media)?p.media.slice():[],ids={};clips.forEach(function(c){var u=c.sourceUrl||'';ids[u]=ids[u]||uid('media');c.mediaId=c.mediaId||ids[u];if(!mediaList.some(function(m){return m.id===c.mediaId}))mediaList.push({id:c.mediaId,url:u,title:source(u)})});
var tr=p.tracks||{};if(!Array.isArray(tr.text))tr.text=[];if(!Array.isArray(tr.audio))tr.audio=[];if(!Array.isArray(tr.sfx))tr.sfx=[];if(!Array.isArray(tr.video))tr.video=['main'];tr.text=tr.text.map(function(x){return Object.assign({id:uid('text'),type:'text',start:0,end:3,text:'Texto',x:0,y:0,scale:1,rotation:0,color:'#ffffff',size:54,position:'center',bold:true},x)});tr.audio=tr.audio.map(function(x){return Object.assign({id:uid('audio'),type:'audio',start:0,end:3,sourceStart:0,volume:1,fadeIn:0,fadeOut:0},x)});tr.sfx=tr.sfx.map(function(x){return Object.assign({id:uid('sfx'),type:'sfx',effect:'whoosh',start:0,duration:.35,volume:.08,name:'SFX'},x)});return{id:p.id||uid('project'),name:p.name||'Proyecto YTDL Clipper',media:mediaList,clips:clips,output:p.output||{aspect_ratio:'9:16'},tracks:tr}}
function enc(v){var a=new TextEncoder().encode(JSON.stringify(v)),s='';for(var i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(){try{var s=location.hash.slice(1);if(!s)return null;s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),a=Uint8Array.from(b,function(c){return c.charCodeAt(0)});return JSON.parse(new TextDecoder().decode(a))}catch(e){return null}}
function save(){
  try{
    var json=JSON.stringify(project);
    localStorage.setItem(KEY,json);
    var hash=enc(project);
    if(hash.length<60000){
      try{window.history.replaceState(null,'','#'+hash)}catch(e){console.warn('[YTDL Editor] No se pudo actualizar el hash:',e)}
    }
    console.log('[YTDL Editor] Proyecto guardado');
    return true;
  }catch(e){
    console.error('[YTDL Editor] No se pudo guardar',e);
    try{localStorage.setItem(KEY,JSON.stringify(project))}catch(e2){}
    return false;
  }
}
function commit(){history.push(clone(project));if(history.length>50)history.shift();future=[];save();render()}
function current(){return project.clips.find(function(c){return c.id===selectedId})||null}function currentLayer(){var all=(project.tracks.text||[]).concat(project.tracks.audio||[],project.tracks.sfx||[]);return all.find(function(x){return x.id===selectedId})||null}function projectTrackEnd(){return Math.max(total(),(project.tracks.text||[]).reduce(function(a,x){return Math.max(a,+x.end||0)},0),(project.tracks.audio||[]).reduce(function(a,x){return Math.max(a,+x.end||0)},0),(project.tracks.sfx||[]).reduce(function(a,x){return Math.max(a,(+x.start||0)+(+x.duration||0))},0))}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},1800)}
function render(){
renderMedia();renderClips();renderTimeline();renderInspector();renderPreview();clock();document.getElementById('summary').textContent=project.clips.length+' clips · '+fmt(total());
}
function renderMedia(){var e=document.getElementById('media');e.innerHTML='';project.media.forEach(function(m){var d=document.createElement('div');d.className='card';var id=ytId(m.url);d.innerHTML=(id?'<img src="https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg">':'')+'<b>'+esc(m.title||source(m.url))+'</b><small>'+source(m.url)+' · '+project.clips.filter(function(c){return c.mediaId===m.id}).length+' clips</small>';d.onclick=function(){var c=project.clips.find(function(x){return x.mediaId===m.id});if(c){selectedId=c.id;render()}};e.appendChild(d)})}
function renderClips(){var e=document.getElementById('clips');e.innerHTML='';project.clips.forEach(function(c,i){var d=document.createElement('div');d.className='card '+(c.id===selectedId?'sel':'');d.draggable=true;d.innerHTML='<b>Clip '+(i+1)+'</b><small>'+fmt(c.start)+' → '+fmt(c.end)+' · '+fmt(dur(c))+'</small><em>'+source(media(c).url)+'</em>';d.onclick=function(){selectedId=c.id;playTime=0;render()};d.ondragstart=function(x){x.dataTransfer.setData('clip',c.id)};e.appendChild(d)})}
function clipAtTime(t){var p=0;for(var i=0;i<project.clips.length;i++){var c=project.clips[i],d=dur(c);if(t>=p&&t<p+d)return{i:i,c:c,local:t-p,start:p,end:p+d};p+=d}return project.clips.length?{i:project.clips.length-1,c:project.clips[project.clips.length-1],local:dur(project.clips[project.clips.length-1]),start:Math.max(0,p-dur(project.clips[project.clips.length-1])),end:p}:null}
function allLayers(){return (project.tracks.text||[]).concat(project.tracks.audio||[],project.tracks.sfx||[])}
function isSelected(id){return id===selectedId||selectedIds.indexOf(id)>=0}
function setSelected(id,multi){if(multi){var i=selectedIds.indexOf(id);if(i>=0)selectedIds.splice(i,1);else selectedIds.push(id);selectedId=id}else{selectedIds=[id];selectedId=id}}
function snapTime(v,ignoreId){if(!snapEnabled)return Math.max(0,v);var step=0.25,best=Math.round(v/step)*step,dist=Math.abs(v-best);project.clips.forEach(function(c){var p=0;for(var i=0;i<project.clips.length;i++){if(project.clips[i].id===c.id)break;p+=dur(project.clips[i])} [p,p+dur(c)].forEach(function(q){var d=Math.abs(v-q);if(d<dist){dist=d;best=q}})});allLayers().forEach(function(x){if(x.id!==ignoreId)[+x.start,+x.end].forEach(function(q){var d=Math.abs(v-q);if(d<dist){dist=d;best=q}})});return Math.max(0,best)}
function refreshTimelineScale(){document.querySelectorAll('#ruler,#tlclips,#tltext,#tlaudio,.lane').forEach(function(e){if(e.classList.contains('lane'))e.style.minWidth=Math.max(800,(projectTrackEnd()+5)*PX)+'px'});renderTimeline();clock()}
function audioKey(){return allLayers().filter(function(x){return x.type==='audio'&&x.sourceUrl&&playTime>=x.start&&playTime<x.end}).map(function(x){return x.id+':'+x.sourceUrl}).join('|')}

function exportProject(){if(!project.clips.length){toast('No hay clips');return}save();var audioTracks=(project.tracks.audio||[]).filter(function(x){return x.kind!=='sfx'}),sfxTracks=(project.tracks.sfx||[]).map(function(x){return{id:x.id,effect:x.effect,start:+x.start||0,duration:+x.duration||.35,volume:x.volume==null?.12:+x.volume,name:x.name||'SFX'}});(project.tracks.audio||[]).filter(function(x){return x.kind==='sfx'}).forEach(function(x){if(!sfxTracks.some(function(s){return s.id===x.id}))sfxTracks.push({id:x.id,effect:x.effect,start:+x.start||0,duration:+x.duration||Math.max(.03,(+x.end||0)-(+x.start||0)),volume:x.volume==null?.12:+x.volume,name:x.name||'SFX'});});var payload={url:project.clips[0].sourceUrl||media(project.clips[0]).url,segments:project.clips.map(function(c){return{source_url:c.sourceUrl||media(c).url,start:+c.start,end:+c.end,zoom:c.zoom||null,transition:c.transition||null,transform:c.transform||null,speed:c.speed||1,mirror:!!c.mirror,color_filter:c.color_filter||'none',clean_silence:!!c.clean_silence,clean_silence_level:c.clean_silence_level||'gentle'}}),tracks:{video:['main'],text:clone(project.tracks.text||[]),audio:clone(audioTracks),sfx:clone(sfxTracks)},output:project.output||{}};if(bridgeWindow&&!bridgeWindow.closed){try{bridgeWindow.postMessage({type:'ytdl-editor-export',bridgeId:bridgeId||null,payload:payload},bridgeOrigin||'*');console.log('[YTDL Editor] Exportación enviada al capturador',bridgeId||'(compatibilidad)');toast('Exportación enviada al capturador')}catch(e){console.error('[YTDL Editor] Error enviando exportación:',e);toast('No se pudo enviar al capturador')}}else{try{navigator.clipboard.writeText(JSON.stringify(payload));console.warn('[YTDL Editor] Sin puente con el capturador; payload copiado al portapapeles');toast('Sin capturador: payload copiado')}catch(e){alert('Abre el editor desde el capturador')}}}
function playClipAt(index){if(index<0||index>=project.clips.length){playing=false;clearInterval(timer);return}selectedId=project.clips[index].id;playTime=project.clips.slice(0,index).reduce(function(a,c){return a+dur(c)},0);renderPreview();clock();var f=document.querySelector('#stage iframe');if(f)setTimeout(function(){try{f.contentWindow.postMessage(JSON.stringify({event:'command',func:'playVideo',args:[]}), '*')}catch(e){}} ,500)}
document.getElementById('play').onclick=function(){playing=!playing;this.textContent=playing?'❚❚':'▶';if(playing){clearInterval(timer);if(!document.querySelector('#stage iframe'))renderPreview();syncAudioLayers();clearInterval(timer);timer=setInterval(function(){playTime=Math.min(projectTrackEnd(),playTime+.1);clock();if(playTime>=projectTrackEnd()){playing=false;clearInterval(timer);document.getElementById('play').textContent='▶';syncPreviewAudio()}},100)}else{clearInterval(timer);syncPreviewAudio()}};
document.getElementById('back').onclick=function(){playTime=Math.max(0,playTime-5);var a=clipAtTime(playTime);if(a)selectedId=a.c.id;renderPreview();clock()};document.getElementById('forward').onclick=function(){playTime=Math.min(total(),playTime+5);var a=clipAtTime(playTime);if(a)selectedId=a.c.id;renderPreview();clock()};
document.getElementById('split').onclick=function(){var c=current();if(!c)return;var a=clipAtTime(playTime);if(!a||a.c.id!==c.id){toast('El cursor debe estar dentro del clip seleccionado');return}var abs=c.start+a.local;if(abs<=c.start+.1||abs>=c.end-.1){toast('El cursor debe estar dentro del clip');return}var b=clone(c);b.id=uid('clip');b.start=abs;c.end=abs;var i=project.clips.findIndex(function(x){return x.id===c.id});project.clips.splice(i+1,0,b);selectedId=b.id;commit()};
function bindToolbar(){
  var undo=document.getElementById('undo'),redo=document.getElementById('redo'),nw=document.getElementById('new'),sv=document.getElementById('save'),ex=document.getElementById('export');
  if(undo)undo.onclick=function(){if(!history.length)return;future.push(clone(project));project=history.pop();selectedId=project.clips[0]?.id||null;selectedIds=[];save();render()};
  if(redo)redo.onclick=function(){if(!future.length)return;history.push(clone(project));project=future.pop();selectedId=project.clips[0]?.id||null;selectedIds=[];save();render()};
  if(nw)nw.onclick=function(){if(confirm('¿Crear un proyecto vacío?')){history.push(clone(project));project=normalize({});selectedId=null;save();render()}};
  if(sv)sv.onclick=function(ev){ev.preventDefault();var ok=save();toast(ok?'Proyecto guardado':'No se pudo guardar');};
  if(ex)ex.onclick=function(ev){ev.preventDefault();exportProject();};
}
bindToolbar();
document.addEventListener('keydown',function(ev){
if(ev.target&&/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName))return;
var k=ev.key.toLowerCase();
if((ev.ctrlKey||ev.metaKey)&&k==='z'){ev.preventDefault();document.getElementById('undo').click();return}
if((ev.ctrlKey||ev.metaKey)&&k==='y'){ev.preventDefault();document.getElementById('redo').click();return}
if(k===' '){ev.preventDefault();document.getElementById('play').click();return}
if(k==='s'&&!ev.ctrlKey&&!ev.metaKey){ev.preventDefault();document.getElementById('split').click();return}
if(k==='arrowleft'){playTime=Math.max(0,playTime-.25);clock();syncAudioLayers()}
if(k==='arrowright'){playTime=Math.min(projectTrackEnd(),playTime+.25);clock();syncAudioLayers()}
});
window.addEventListener('beforeunload',function(){clearInterval(timer);save()});window.addEventListener('message',function(ev){
  try{
    var allowedOrigins=[location.origin,'https://www.youtube.com','https://www.twitch.tv'];
    if(allowedOrigins.indexOf(ev.origin)<0)return;
    var data=ev.data;

    if(data&&data.type==='ytdl-editor-project'&&data.project){
      if(!Array.isArray(data.project.clips)&&!Array.isArray(data.project.segments))return;

      bridgeWindow=ev.source||null;
      bridgeOrigin=ev.origin||'';
      bridgeId=String(data.project.bridgeId||'');
      project=normalize(data.project);
      selectedId=project.clips[0]?.id||null;
      selectedIds=[];
      playTime=0;
      save();
      render();

      console.log('[YTDL Editor] Proyecto recibido:',{
        clips:project.clips.length,
        media:project.media.length,
        sources:project.media.map(function(m){return m.url}),
        bridgeId:bridgeId
      });

      if(bridgeWindow&&!bridgeWindow.closed&&bridgeId){
        try{
          bridgeWindow.postMessage({type:'ytdl-editor-ready',bridgeId:bridgeId},bridgeOrigin||'*');
          console.log('[YTDL Editor] Puente con capturador confirmado');
        }catch(err){
          console.warn('[YTDL Editor] No se pudo confirmar el puente:',err);
        }
      }
      console.log('[YTDL Editor] Proyecto cargado correctamente');
      return;
    }

    if(data&&data.type==='ytdl-editor-ping'&&bridgeWindow===ev.source&&(!bridgeId||String(data.bridgeId)===bridgeId)){
      try{ev.source.postMessage({type:'ytdl-editor-ready',bridgeId:bridgeId},ev.origin||'*')}catch(err){}
    }
  }catch(err){
    console.error('[YTDL Editor] No se pudo procesar mensaje:',err);
  }
});
project=normalize(dec()||JSON.parse(localStorage.getItem(KEY)||'null')||{});
project.clips.forEach(function(c){c.transform=c.transform||{x:0,y:0,scale:1,rotation:0,fit:'cover'}});
selectedId=project.clips[0]?.id||null;selectedIds=[];
try{render()}catch(e){console.error('[YTDL Editor] Error durante render inicial:',e);toast('Error al cargar el editor: '+(e&&e.message||e))}
try{bindTimelineControls()}catch(e){console.error('[YTDL Editor] Error en controles de timeline:',e)}
})();
</script>
